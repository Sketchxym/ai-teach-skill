<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker></defs><style>text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="32" y="42" fill="#f8fafc" font-size="22" font-weight="700">Agent 的目标执行闭环</text><text x="32" y="68" fill="#94a3b8" font-size="12">自主不等于无边界：每一步都在工具、权限和停止条件内</text>
<path d="M490 135V195M490 275V335M420 380H280V235H360M560 380H720V235H620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#0f172a" stroke-width="2"><rect x="360" y="95" width="260" height="70" rx="30" stroke="#60a5fa"/><rect x="360" y="195" width="260" height="80" rx="10" stroke="#a78bfa"/><rect x="360" y="335" width="260" height="90" rx="10" stroke="#34d399"/><rect x="70" y="195" width="210" height="80" rx="10" stroke="#fbbf24"/><rect x="700" y="195" width="210" height="80" rx="10" stroke="#fb7185"/><rect x="260" y="500" width="460" height="80" rx="10" stroke="#fb923c"/></g>
<g text-anchor="middle"><text x="490" y="126" fill="#fff" font-size="17" font-weight="700">目标</text><text x="490" y="149" fill="#bfdbfe" font-size="12">用户想得到什么结果？</text><text x="490" y="228" fill="#fff" font-size="17" font-weight="700">规划下一步</text><text x="490" y="252" fill="#ddd6fe" font-size="12">选择动作、工具和完成条件</text><text x="490" y="370" fill="#fff" font-size="17" font-weight="700">观察结果并判断</text><text x="490" y="396" fill="#bbf7d0" font-size="12">继续、改路、询问，还是结束？</text><text x="175" y="228" fill="#fff" font-size="16" font-weight="700">工具与资料</text><text x="175" y="252" fill="#fde68a" font-size="12">读取、检索、计算、写入</text><text x="805" y="228" fill="#fff" font-size="16" font-weight="700">Harness 护栏</text><text x="805" y="252" fill="#fecdd3" font-size="12">权限、审批、沙箱、审计</text><text x="490" y="533" fill="#fff" font-size="16" font-weight="700">停止条件</text><text x="490" y="558" fill="#fed7aa" font-size="12">目标完成、需要用户、风险过高或达到资源上限</text></g>
<path d="M490 425V500" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="470" fill="#94a3b8" font-size="11">满足停止条件</text></svg>
