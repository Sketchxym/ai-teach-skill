<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker></defs><style>text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}</style><rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="32" y="42" fill="#f8fafc" font-size="22" font-weight="700">一次工具调用，四个角色</text><text x="32" y="68" fill="#94a3b8" font-size="12">模型负责选择与组织，平台负责校验与执行</text>
<path d="M210 180H290M470 180H550M730 180H810M810 330H730M550 330H470M290 330H210" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#0f172a" stroke-width="2"><rect x="40" y="135" width="170" height="90" rx="10" stroke="#22d3ee"/><rect x="290" y="135" width="180" height="90" rx="10" stroke="#a78bfa"/><rect x="550" y="135" width="180" height="90" rx="10" stroke="#fbbf24"/><rect x="810" y="135" width="150" height="90" rx="10" stroke="#34d399"/><rect x="810" y="285" width="150" height="90" rx="10" stroke="#34d399"/><rect x="550" y="285" width="180" height="90" rx="10" stroke="#fbbf24"/><rect x="290" y="285" width="180" height="90" rx="10" stroke="#a78bfa"/><rect x="40" y="285" width="170" height="90" rx="10" stroke="#22d3ee"/></g>
<g text-anchor="middle"><text x="125" y="168" fill="#fff" font-size="16" font-weight="700">用户</text><text x="125" y="194" fill="#94a3b8" font-size="12">提出目标</text><text x="380" y="168" fill="#fff" font-size="16" font-weight="700">模型</text><text x="380" y="194" fill="#94a3b8" font-size="12">选择工具与参数</text><text x="640" y="168" fill="#fff" font-size="16" font-weight="700">平台</text><text x="640" y="194" fill="#94a3b8" font-size="12">校验权限并调用</text><text x="885" y="168" fill="#fff" font-size="16" font-weight="700">工具</text><text x="885" y="194" fill="#94a3b8" font-size="12">执行真实动作</text><text x="885" y="318" fill="#fff" font-size="16" font-weight="700">结果</text><text x="885" y="344" fill="#94a3b8" font-size="12">数据或错误</text><text x="640" y="318" fill="#fff" font-size="16" font-weight="700">平台</text><text x="640" y="344" fill="#94a3b8" font-size="12">把结果交回模型</text><text x="380" y="318" fill="#fff" font-size="16" font-weight="700">模型</text><text x="380" y="344" fill="#94a3b8" font-size="12">解释并组织回答</text><text x="125" y="318" fill="#fff" font-size="16" font-weight="700">用户</text><text x="125" y="344" fill="#94a3b8" font-size="12">看到结果</text></g>
<rect x="195" y="440" width="610" height="70" rx="10" fill="rgba(136,19,55,.35)" stroke="#fb7185"/><text x="500" y="470" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">不要把“模型想调用”当成“动作已成功”</text><text x="500" y="495" fill="#fecdd3" font-size="12" text-anchor="middle">权限拒绝、参数错误、超时和工具失败都需要平台处理</text></svg>
